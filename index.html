<head>

  <meta name="description"
    content="Jubel Havilah Enterprise - Inventory Management System for efficient stock tracking, sales, and purchasing." />
  <meta name="theme-color" content="#10b981" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <title>JUBEL HAVILAH ENTERPRISE - Inventory Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {

      /* Force print colors */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Hide everything by default when printing receipt */
      body.printing-receipt #root {
        display: none !important;
      }

      /* Show the print container */
      body.printing-receipt #print-container {
        display: block !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: auto !important;
        background: white !important;
        z-index: 99999 !important;
        padding: 10mm !important;
      }

      /* Standard no-print class */
      .no-print {
        display: none !important;
      }

      /* Print show helper */
      .print-show {
        display: block !important;
      }
    }

    /* Hide print container by default on screen */
    #print-container {
      display: none;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-down {
      animation: fadeInDown 0.5s ease-out forwards;
    }
  </style>

}
</script>
